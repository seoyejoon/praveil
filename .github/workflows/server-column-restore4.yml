name: Column restore font sizes (one-off)
# 일회용: 글 정리로 해제한 글자 크기를 원본대로 되돌림 (병원 요청 2026-11-19). 빈 줄 · 글자 크기는 원본 그대로, 사진 칸 변환만 유지.
# 지금 내용은 posts_tidy_backup 에 백업. 기록에는 글 번호와 개수만 출력. 실행 뒤 이 파일 삭제.
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y sshpass >/dev/null
      - env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          APP=/opt/psbox-admin-only
          cat > $APP/zz-run.mjs <<'JS'
          import pg from "pg";
          import { normalizeColumnDocument } from "./lib/column-normalize.ts";
          import { parseColumnDocument, serializeColumnDocument } from "./lib/column-document.ts";
          const sizes = (s) => (s.match(/"fontSize":"/g) ?? []).length;
          const section = (image) => ({ type: "columnImageSection", attrs: { slots: [{ src: String(image.attrs?.src), alt: String(image.attrs?.alt ?? "") }] } });
          const blank = (c) => c.type === "text" && !(c.text ?? "").trim();
          const isImg = (c) => c.type === "image" && typeof c.attrs?.src === "string" && c.attrs.src;
          // 사진 → 사진 칸만 (글자 크기 · 빈 줄은 원본 그대로)
          const imagesOnly = (doc) => ({ ...doc, content: (doc.content ?? []).flatMap((node) => {
            if (isImg(node)) return [section(node)];
            if (node.type === "paragraph" && node.content?.length && node.content.every((c) => c.type === "image" || blank(c))) {
              const images = node.content.filter(isImg);
              if (images.length) return images.map(section);
            }
            return [node];
          }) });
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          const rows = await c.query(
            "SELECT DISTINCT ON (b.post_id) b.post_id, b.content AS original, p.content AS current FROM posts_tidy_backup b JOIN posts p ON p.id = b.post_id ORDER BY b.post_id, b.backed_up_at ASC");
          await c.query("BEGIN");
          for (const r of rows.rows) {
            const original = parseColumnDocument(r.original);
            if (!original) { console.log(`#${r.post_id} 건너뜀: 원본 형식 검사 실패`); continue; }
            const next = serializeColumnDocument(imagesOnly(original));
            if (!parseColumnDocument(next)) { console.log(`#${r.post_id} 건너뜀: 결과 형식 검사 실패`); continue; }
            const untouched = r.current === serializeColumnDocument(normalizeColumnDocument(original).doc);
            await c.query("INSERT INTO posts_tidy_backup (post_id, content) VALUES ($1, $2)", [r.post_id, r.current]);
            await c.query("UPDATE posts SET content = $1, updated_at = CURRENT_TIMESTAMP WHERE id = $2", [next, r.post_id]);
            console.log(`#${r.post_id} 글자 크기 되돌림: ${sizes(r.current)}곳 → ${sizes(next)}곳 (원본 ${sizes(r.original)}곳)${untouched ? "" : " · 주의: 되돌린 뒤 누가 고친 글이었음 (직전 내용 백업함)"}`);
          }
          await c.query("COMMIT");
          await c.end();
          JS
          chown appuser:appuser $APP/zz-run.mjs
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $APP && node --env-file=.env.local zz-run.mjs" || { rm -f $APP/zz-run.mjs; exit 1; }
          rm -f $APP/zz-run.mjs
          echo "== 완료"
          REMOTE
