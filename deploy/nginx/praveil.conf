# 프라베일 홈페이지 + 관리자 Nginx 설정
# 도메인이 확정되면 아래 두 줄(praveil.co.kr / admin.praveil.co.kr)만 바꾸세요. (파일 전체에서 바꾸기)
#   홈페이지  → 127.0.0.1:3000 (Next.js, PM2 "praveil-web")
#   관리자    → 127.0.0.1:3100 (Next.js, PM2 "praveil-admin")
#   /uploads/ → 관리자에서 올린 이미지 폴더를 두 주소에서 모두 바로 제공
# SSL 인증서는 certbot 으로 발급합니다. (deploy/INSTALL.md 5단계)

upstream praveil_web   { server 127.0.0.1:3000; keepalive 8; }
upstream praveil_admin { server 127.0.0.1:3100; keepalive 8; }

# http → https
server {
  listen 80;
  server_name praveil.co.kr www.praveil.co.kr admin.praveil.co.kr;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# www → 기본 주소
server {
  listen 443 ssl;
  http2 on;
  server_name www.praveil.co.kr;
  ssl_certificate     /etc/letsencrypt/live/praveil.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/praveil.co.kr/privkey.pem;
  return 301 https://praveil.co.kr$request_uri;
}

# 홈페이지
server {
  listen 443 ssl;
  http2 on;
  server_name praveil.co.kr;
  ssl_certificate     /etc/letsencrypt/live/praveil.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/praveil.co.kr/privkey.pem;

  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 그누보드처럼 도메인/admin 으로 들어오면 관리자 주소로 보낸다.
  location = /admin      { return 302 https://admin.praveil.co.kr/site-admin/login; }
  location ^~ /admin/    { return 302 https://admin.praveil.co.kr/site-admin/login; }
  location ^~ /site-admin { return 302 https://admin.praveil.co.kr$request_uri; }

  # 관리자에서 저장 시 호출하는 새로고침 주소는 서버 내부(127.0.0.1:3000)로만 쓰고 밖에서는 막는다.
  location = /api/revalidate { return 404; }

  # 관리자에서 올린 이미지
  location ^~ /uploads/ {
    alias /opt/psbox-admin-only/storage/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  # 빌드된 정적 파일은 오래 캐시
  location ^~ /_next/static/ {
    proxy_pass http://praveil_web;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://praveil_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

# 관리자
server {
  listen 443 ssl;
  http2 on;
  server_name admin.praveil.co.kr;
  ssl_certificate     /etc/letsencrypt/live/praveil.co.kr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/praveil.co.kr/privkey.pem;

  # 관리자 이미지 업로드 한도(8MB)보다 넉넉하게
  client_max_body_size 20m;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = / { return 302 /site-admin/login; }

  location ^~ /uploads/ {
    alias /opt/psbox-admin-only/storage/uploads/;
    expires 30d;
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://praveil_admin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 관리자 .env.local 의 TRUST_PROXY_HEADERS=true 와 함께 사용 (접속자 IP를 Nginx가 덮어씀)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }
}
