name: Server upload log (one-off)
# 일회용: 관리자 업로드 400 원인 확인용 로그 읽기 (읽기만 함, 비밀값 출력 없음). 확인 뒤 삭제.
on:
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y sshpass >/dev/null
      - env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          L=$(getent passwd appuser | cut -d: -f6)/.pm2/logs
          echo "== pm2 log files"; ls -la $L 2>/dev/null | grep -i admin
          echo "== admin logs: upload / body"; grep -h -i -E "image-upload|Request body exceeded|formData|multipart|uploads" $L/praveil-admin-*.log 2>/dev/null | tail -40 | cut -c1-300
          echo "== nginx admin upload requests (status, size)"; grep -h "/api/uploads" /var/log/nginx/access.log 2>/dev/null | tail -20 | awk '{print $4, $6, $7, $9, $10}'
          echo "== nginx error log (body/upstream)"; grep -h -i -E "client intended|body|upstream|temp" /var/log/nginx/error.log 2>/dev/null | tail -15 | cut -c1-300
          echo "== nginx active admin conf (size limits)"; grep -rh -E "client_max_body_size|client_body|proxy_request_buffering|server_name" /etc/nginx/sites-enabled/ /etc/nginx/nginx.conf /etc/nginx/conf.d/ 2>/dev/null
          echo "== client body temp dir"; ls -ld /var/lib/nginx/body 2>/dev/null; df -h /var/lib/nginx 2>/dev/null | tail -1
          REMOTE
