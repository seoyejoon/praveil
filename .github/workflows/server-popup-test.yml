name: Server popup test
# 팝업 점검용 임시 작업 (scripts/popup-test.mjs): add · cleanup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: add | cleanup
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass >/dev/null
      - name: Run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in add|cleanup) ;; *) echo "mode 오류"; exit 1;; esac
          sshpass -e scp -o StrictHostKeyChecking=accept-new scripts/popup-test.mjs "$USER@$HOST:/tmp/popup-test.mjs"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" bash -s -- "$MODE" <<'REMOTE'
          set -e
          A=/opt/psbox-admin-only
          install -o appuser -m 644 /tmp/popup-test.mjs $A/scripts/popup-test.mjs && rm /tmp/popup-test.mjs
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $A && node --env-file=.env.local scripts/popup-test.mjs $1"
          rm -f $A/scripts/popup-test.mjs
          # 홈페이지 캐시 새로 고침
          . /etc/praveil/secrets.env
          curl -s -o /dev/null -w "revalidate %{http_code}\n" -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" http://127.0.0.1:3000/api/revalidate || true
          REMOTE
