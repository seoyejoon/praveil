name: Server member test
# 회원 기능 점검용 임시 작업 (scripts/member-test.mjs): add · approve · cleanup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: add | approve | approval-on | cleanup
        required: true
      username:
        description: 승인할 테스트 아이디 (pvtest...)
        required: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass >/dev/null
      - name: Run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          MODE: ${{ inputs.mode }}
          NAME: ${{ inputs.username }}
        run: |
          case "$MODE" in add|approve|approval-on|cleanup) ;; *) echo "mode 오류"; exit 1;; esac
          [[ -z "$NAME" || "$NAME" =~ ^pvtest[a-z0-9]{0,20}$ ]] || { echo "username 오류"; exit 1; }
          sshpass -e scp -o StrictHostKeyChecking=accept-new scripts/member-test.mjs "$USER@$HOST:/tmp/member-test.mjs"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" bash -s -- "$MODE" "$NAME" <<'REMOTE'
          set -e
          A=/opt/psbox-admin-only
          install -o appuser -m 644 /tmp/member-test.mjs $A/scripts/member-test.mjs && rm /tmp/member-test.mjs
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $A && node --env-file=.env.local scripts/member-test.mjs $1 $2"
          rm -f $A/scripts/member-test.mjs
          # 홈페이지 캐시 새로 고침
          . /etc/praveil/secrets.env
          curl -s -o /dev/null -w "revalidate %{http_code}\n" -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" http://127.0.0.1:3000/api/revalidate || true
          REMOTE
