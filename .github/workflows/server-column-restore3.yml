name: Column restore 13 (one-off)
# 일회용: #13 글을 글 정리 전 원본(빈 줄 포함)으로 되돌림 (병원 요청 2026-11-19). 글자 크기 해제 · 사진 칸만 다시 적용.
# 지금 내용은 posts_tidy_backup 에 백업. 기록에는 글 번호와 개수만 출력. 실행 뒤 이 파일 삭제.
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y sshpass >/dev/null
      - env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          APP=/opt/psbox-admin-only
          cat > $APP/zz-run.mjs <<'JS'
          import pg from "pg";
          import { normalizeColumnDocument } from "./lib/column-normalize.ts";
          import { parseColumnDocument, serializeColumnDocument } from "./lib/column-document.ts";
          const empty = (n) => n.type === "paragraph" && (n.content ?? []).every((c) => c.type === "hardBreak" || (c.type === "text" && !(c.text ?? "").trim()));
          const countEmpty = (node) => (node.content ?? []).reduce((s, c) => s + (empty(c) ? 1 : 0) + (c.type === "paragraph" || c.type === "heading" ? 0 : countEmpty(c)), 0);
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          const r = (await c.query("SELECT b.content AS original, p.content AS current FROM posts_tidy_backup b JOIN posts p ON p.id = b.post_id WHERE b.post_id = 13 ORDER BY b.backed_up_at ASC LIMIT 1")).rows[0];
          const original = r && parseColumnDocument(r.original);
          if (!original) { console.log("#13 원본 백업을 읽지 못함"); process.exit(1); }
          const { doc, report } = normalizeColumnDocument(original);
          const next = serializeColumnDocument(doc);
          if (!parseColumnDocument(next)) { console.log("#13 결과 형식 검사 실패"); process.exit(1); }
          await c.query("BEGIN");
          await c.query("INSERT INTO posts_tidy_backup (post_id, content) VALUES (13, $1)", [r.current]);
          await c.query("UPDATE posts SET content = $1, updated_at = CURRENT_TIMESTAMP WHERE id = 13", [next]);
          await c.query("COMMIT");
          console.log(`#13 되돌림: 빈 줄 ${countEmpty(doc)}개 (원본 ${countEmpty(original)}개) · 글자 크기 ${report.fontSizes}곳 해제 · 사진 ${report.images}장 사진 칸`);
          await c.end();
          JS
          chown appuser:appuser $APP/zz-run.mjs
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $APP && node --env-file=.env.local zz-run.mjs" || { rm -f $APP/zz-run.mjs; exit 1; }
          rm -f $APP/zz-run.mjs
          echo "== 완료"
          REMOTE
