name: Column restore empty lines 2 (one-off)
# 일회용: 글 정리로 지운 빈 줄을 되돌림 (병원 요청 2026-11-19). 정리 뒤에 손으로 고친 부분은 그대로 두고 빈 줄만 원본 자리에 다시 넣음.
# 바꾸기 전 내용은 posts_tidy_backup 에 한 번 더 백업. 기록에는 글 번호와 개수만 출력. 실행 뒤 이 파일 삭제.
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y sshpass >/dev/null
      - env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          APP=/opt/psbox-admin-only
          clean() { rm -f $APP/zz-run.mjs $APP/zz-merge.mjs $APP/lib/zz-normalize-old.ts; }
          cat > $APP/lib/zz-normalize-old.ts <<'OLDTS'
          import type { ColumnNode } from "./column-document";

          // AI 가 서버에 바로 넣은 원장칼럼을 편집기에서 직접 쓴 글과 같은 모양으로 정리한다 (편집기 '글 정리' 버튼).
          // 1) 본문 사이 빈 줄(엔터만 친 문단) 삭제 — 문단 간격은 화면 설정(20px)이 맡는다
          // 2) 문장마다 직접 지정된 글자 크기 해제 — 글자색 · 형광펜은 그대로 둔다
          // 3) 본문에 바로 놓인 사진을 '사진 칸'으로 — 칸마다 '대표로' 버튼 · 같은 크기 규칙이 적용된다
          export type NormalizeReport = { emptyParagraphs: number; fontSizes: number; images: number };

          const isEmptyParagraph = (node: ColumnNode) =>
            node.type === "paragraph" &&
            (node.content ?? []).every((child) => child.type === "hardBreak" || (child.type === "text" && !(child.text ?? "").trim()));

          function stripFontSize(node: ColumnNode, report: NormalizeReport): ColumnNode {
            const marks = node.marks?.flatMap((mark) => {
              if (mark.type !== "textStyle" || !mark.attrs?.fontSize) return [mark];
              report.fontSizes += 1;
              const { fontSize: _removed, ...rest } = mark.attrs;
              void _removed;
              // 글자색 등 다른 값이 남아 있으면 그 값만 둔다
              return Object.values(rest).some((value) => value !== null && value !== undefined && value !== "") ? [{ ...mark, attrs: rest }] : [];
            });
            const content = node.content?.map((child) => stripFontSize(child, report));
            return {
              ...node,
              ...(node.marks ? { marks: marks && marks.length ? marks : undefined } : {}),
              ...(node.content ? { content } : {}),
            };
          }

          export function normalizeColumnDocument(doc: ColumnNode): { doc: ColumnNode; report: NormalizeReport } {
            const report: NormalizeReport = { emptyParagraphs: 0, fontSizes: 0, images: 0 };
            const top = (doc.content ?? []).flatMap((node): ColumnNode[] => {
              if (isEmptyParagraph(node)) {
                report.emptyParagraphs += 1;
                return [];
              }
              if (node.type === "image" && typeof node.attrs?.src === "string" && node.attrs.src) {
                report.images += 1;
                return [{ type: "columnImageSection", attrs: { slots: [{ src: node.attrs.src, alt: String(node.attrs.alt ?? "") }] } }];
              }
              // 문단 안에 사진만 들어 있는 경우도 사진 칸으로
              if (node.type === "paragraph" && node.content?.length && node.content.every((child) => child.type === "image" || (child.type === "text" && !(child.text ?? "").trim()))) {
                const images = node.content.filter((child) => child.type === "image" && typeof child.attrs?.src === "string" && child.attrs.src);
                if (images.length) {
                  report.images += images.length;
                  return images.map((image) => ({ type: "columnImageSection", attrs: { slots: [{ src: String(image.attrs?.src), alt: String(image.attrs?.alt ?? "") }] } }));
                }
              }
              return [stripFontSize(node, report)];
            });
            // 상자(요약 · TIP · Q&A 등) 안의 빈 줄도 삭제. 표 칸 · 목록 줄 안은 그대로 (칸이 비면 안 되므로)
            const tidy = (node: ColumnNode): ColumnNode => {
              if (!node.content || node.type === "paragraph" || node.type === "heading") return node;
              const keepEmpty = node.type === "tableCell" || node.type === "tableHeader" || node.type === "listItem";
              const mapped = node.content.map(tidy);
              const children = keepEmpty ? mapped : mapped.filter((child) => {
                if (!isEmptyParagraph(child)) return true;
                report.emptyParagraphs += 1;
                return false;
              });
              return { ...node, content: children.length ? children : [{ type: "paragraph" }] };
            };
            const content = top.map(tidy);
            return { doc: { ...doc, content: content.length ? content : [{ type: "paragraph" }] }, report };
          }
          OLDTS
          cat > $APP/zz-merge.mjs <<'MERGE'
          import { normalizeColumnDocument as oldN } from "./lib/zz-normalize-old.ts";
          import { normalizeColumnDocument as newN } from "./lib/column-normalize.ts";
          // 원본(original)에서 빈 줄을 되살리되, 정리 뒤에 손으로 고친 부분(current)은 그대로 둔다
          export const countEmpty = (node) => {
            const empty = (n) => n.type === "paragraph" && (n.content ?? []).every((c) => c.type === "hardBreak" || (c.type === "text" && !(c.text ?? "").trim()));
            return (node.content ?? []).reduce((sum, c) => sum + (empty(c) ? 1 : 0) + (c.type === "paragraph" || c.type === "heading" ? 0 : countEmpty(c)), 0);
          };
          export function mergeRestore(original, current) {
            const out = []; let i = 0; let edited = 0;
            const cur = current.content ?? [];
            for (const node of original.content ?? []) {
              const one = { type: "doc", content: [node] };
              const oldOut = oldN(one).doc.content;
              const dropped = oldOut.length === 1 && oldOut[0].type === "paragraph" && !oldOut[0].content && oldN({ type: "doc", content: [node, { type: "heading", content: [{ type: "text", text: "x" }] }] }).doc.content.length === 1;
              if (dropped) { out.push(node); continue; }
              const slice = cur.slice(i, i + oldOut.length);
              if (slice.length !== oldOut.length) return null;
              if (JSON.stringify(slice) === JSON.stringify(oldOut)) out.push(...newN(one).doc.content);
              else { if (slice.some((s, k) => s.type !== oldOut[k].type)) return null; out.push(...slice); edited += 1; }
              i += oldOut.length;
            }
            if (i !== cur.length) return null;
            return { doc: { ...current, content: out }, edited };
          }
          MERGE
          cat > $APP/zz-run.mjs <<'JS'
          import pg from "pg";
          import { mergeRestore, countEmpty } from "./zz-merge.mjs";
          import { normalizeColumnDocument } from "./lib/column-normalize.ts";
          import { parseColumnDocument, serializeColumnDocument } from "./lib/column-document.ts";
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          const rows = await c.query(
            "SELECT DISTINCT ON (b.post_id) b.post_id, b.content AS original, p.content AS current FROM posts_tidy_backup b JOIN posts p ON p.id = b.post_id ORDER BY b.post_id, b.backed_up_at ASC");
          await c.query("BEGIN");
          for (const r of rows.rows) {
            const original = parseColumnDocument(r.original);
            const current = parseColumnDocument(r.current);
            if (!original || !current) { console.log(`#${r.post_id} 건너뜀: 형식 검사 실패`); continue; }
            const want = countEmpty(original);
            if (r.current === serializeColumnDocument(normalizeColumnDocument(original).doc)) { console.log(`#${r.post_id} 이미 되돌려짐: 빈 줄 ${countEmpty(current)}개 (원본 ${want}개)`); continue; }
            const merged = mergeRestore(original, current);
            if (!merged) { console.log(`#${r.post_id} 건너뜀: 정리 뒤 문단 수가 바뀌어 자동으로 못 맞춤 (지금 빈 줄 ${countEmpty(current)}개, 원본 ${want}개)`); continue; }
            const next = serializeColumnDocument(merged.doc);
            if (!parseColumnDocument(next)) { console.log(`#${r.post_id} 건너뜀: 결과 형식 검사 실패`); continue; }
            await c.query("INSERT INTO posts_tidy_backup (post_id, content) VALUES ($1, $2)", [r.post_id, r.current]);
            await c.query("UPDATE posts SET content = $1, updated_at = CURRENT_TIMESTAMP WHERE id = $2", [next, r.post_id]);
            console.log(`#${r.post_id} 빈 줄 되돌림: ${countEmpty(current)}개 → ${countEmpty(merged.doc)}개 (원본 ${want}개) · 정리 뒤 고친 부분 ${merged.edited}곳은 그대로 둠`);
          }
          await c.query("COMMIT");
          await c.end();
          JS
          chown appuser:appuser $APP/zz-run.mjs $APP/zz-merge.mjs $APP/lib/zz-normalize-old.ts
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $APP && node --env-file=.env.local zz-run.mjs" || { clean; exit 1; }
          clean
          echo "== 완료"
          REMOTE
