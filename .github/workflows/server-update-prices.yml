name: Server update prices
# 병원 가격표(2026-10-31 수정본)로 관리자 DB 시술 가격을 바꿈 (일회용 · 실행 후 삭제, scripts/update-prices.mjs)
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass >/dev/null
      - name: Update prices
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=accept-new scripts/update-prices.mjs "$USER@$HOST:/tmp/update-prices.mjs"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -e
          A=/opt/psbox-admin-only
          install -o appuser -m 644 /tmp/update-prices.mjs $A/scripts/update-prices.mjs && rm /tmp/update-prices.mjs
          sudo -u appuser -H env -u DATABASE_URL bash -c "cd $A && node --env-file=.env.local scripts/update-prices.mjs"
          rm -f $A/scripts/update-prices.mjs
          # 홈페이지 캐시 새로 고침
          . /etc/praveil/secrets.env
          curl -s -o /dev/null -w "revalidate %{http_code}\n" -X POST -H "Authorization: Bearer $REVALIDATE_SECRET" http://127.0.0.1:3000/api/revalidate || true
          REMOTE
